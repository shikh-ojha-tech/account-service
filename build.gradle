plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'jacoco'
}

group = 'com.account'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom 'org.testcontainers:testcontainers-bom:1.20.4'
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'
    implementation 'org.flywaydb:flyway-core:11.8.2'
    implementation 'org.flywaydb:flyway-database-postgresql:11.8.2'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.amqp:spring-rabbit-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:rabbitmq'
}

def jacocoExcludes = [
        '**/AccountApplication.class',
        '**/api/dto/**',
        '**/api/HomeController.class',
        '**/config/OpenApiConfig.class',
]

tasks.named('test', Test) {
    useJUnitPlatform()
    include '**/*Test.class', '**/*Tests.class', '**/*TestCase.class', '**/*IT.class'
    maxHeapSize = '768m'
    finalizedBy tasks.named('jacocoTestReport')

    configure(extensions.getByType(JacocoTaskExtension)) {
        destinationFile = layout.buildDirectory.file('jacoco/test.exec').get().asFile
        includes = ['com.account.*']
    }
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    executionData.setFrom(layout.buildDirectory.file('jacoco/test.exec'))
    classDirectories.setFrom(
            files(sourceSets.main.output.classesDirs.files.collect { dir ->
                fileTree(dir: dir, exclude: jacocoExcludes)
            })
    )
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('jacocoTestReport')
    executionData.setFrom(layout.buildDirectory.file('jacoco/test.exec'))
    classDirectories.setFrom(
            files(sourceSets.main.output.classesDirs.files.collect { dir ->
                fileTree(dir: dir, exclude: jacocoExcludes)
            })
    )
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
